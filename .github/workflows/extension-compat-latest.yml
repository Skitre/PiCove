name: Extension compatibility latest audit

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension-compat-latest
  cancel-in-progress: true

jobs:
  audit-rpiv-latest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Add a disposable npm latest alias alongside pinned regressions
        run: >-
          pnpm --filter @pideck/pi-host add --save-dev --save-exact
          '@pideck-test/rpiv-ask-user-question-latest@npm:@juicesharp/rpiv-ask-user-question@latest'
          --lockfile=false
      - name: Build the protocol workspace
        run: pnpm --filter @pideck/protocol run build
      - name: Audit RPC compatibility and explicit desktop enhancement coverage
        env:
          PIDECK_RPIV_LATEST: "1"
        run: >-
          pnpm --filter @pideck/pi-host exec vitest run
          src/real-extension-compatibility.test.ts
