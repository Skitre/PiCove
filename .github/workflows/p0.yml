name: P0 source and staged release gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PIDECK_FORMAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

concurrency:
  group: p0-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-node-minimum:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:quick

  verify-p0:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      ARTIFACTS_DIR: artifacts/p0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - uses: actions/cache@v4
        with:
          path: .runtime-cache
          key: ${{ runner.os }}-release-runtime-${{ hashFiles('scripts/release-runtime.lock.json') }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:p0
      - run: pnpm package:sidecar:with-node
      - run: pnpm validate:resources
      - run: pnpm smoke:staged-host
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-resource-layout-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/p0
          if-no-files-found: ignore
          retention-days: 14

  verify-rust-macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - run: node scripts/prepare-rust-test-resources.mjs
      - run: pnpm lint:rust
